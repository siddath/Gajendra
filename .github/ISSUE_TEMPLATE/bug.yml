name: Bug report
description: Report reproducible Gajendra behavior without private AI-agent content.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste task prompts, transcripts, tokens, credentials, or private project names. Use synthetic examples.
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - macOS bottom-right control or hover card
        - macOS organizer or menu bar
        - MCP App
        - Codex, Claude, Cursor, Grok Build, or configured source
        - plugin service or persistence
        - build or installation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest synthetic sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, Gajendra version/commit, and provider/CLI version when relevant.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private task content, prompts, transcripts, tokens, and credentials.
          required: true
